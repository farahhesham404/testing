name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  cypress-run:
    name: Run Cypress BDD Tests
    runs-on: [self-hosted, windows, x64]

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true

      - name: Validate Node Version is 20+
        run: |
          $nodeVersion = node -v
          $majorVersion = $nodeVersion -replace '^v(\d+)\..*', '$1'
          Write-Host "Node version: $nodeVersion"
          Write-Host "Major version: $majorVersion"
          if ([int]$majorVersion -lt 20) {
            Write-Error "ERROR: Node version must be 20 or higher. Current: $nodeVersion"
            exit 1
          }
          Write-Host "✓ Node version: $nodeVersion"
          Write-Host "✓ npm version: $(npm -v)"
        shell: pwsh

      - name: Clean npm cache and node_modules
        run: |
          npm cache clean --force
          Remove-Item -Path node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path package-lock.json -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Install Dependencies
        run: npm ci

      - name: Verify Cypress Installation
        run: npx cypress verify

      - name: Run Cypress BDD Tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          headed: false
          config: baseUrl=https://practicesoftwaretesting.com
        env:
          CYPRESS_baseUrl: https://practicesoftwaretesting.com

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Test Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cypress/reports/cucumber-report.json
          retention-days: 7
