name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  cypress-run:
    name: Run Cypress BDD Tests
    runs-on: [self-hosted, windows, x64]

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: C:\Users\Hp\.cache\Cypress
          key: cypress-cache-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            cypress-cache-${{ runner.os }}-

      - name: Check Node and npm versions
        run: |
          node -v
          npm -v

      - name: Clean npm cache and node_modules
        run: |
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue

      - name: Install Dependencies
        run: npm ci

      - name: Verify Cypress Installation
        run: npx cypress verify

      - name: Ensure Git tools are in PATH (for gzip)
        run: |
          if (Test-Path "C:\Program Files\Git\usr\bin") {
            echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
          }
        shell: powershell
      - name: Run Cypress BDD Tests
        uses: cypress-io/github-action@v6
        with:
          browser: firefox
          headed: false
          config: baseUrl=https://practicesoftwaretesting.com
        env:
          CYPRESS_baseUrl: https://practicesoftwaretesting.com

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Test Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cypress/reports/cucumber-report.json
          retention-days: 7
